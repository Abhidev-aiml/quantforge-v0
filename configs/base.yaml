# Base config — all keys have defaults in engine/config.py.
# Experiment configs override these values.

data:
  path: data/raw/daily/xauusd_1D_comma.csv
  symbol: XAUUSD
  start: null
  end: null

engine:
  initial_cash: 100000.0
  commission_bps: 1.0
  slippage_bps: 5.0
  no_trade_band: 0.01
  warmup_bars: 0

strategy:
  path: strategies/07_absolute_momentum.py
  params: {}

monte_carlo:
  enabled: true
  n_sims: 5000
  n_perm: 500
  block_sizes: [2, 5, 20, 40, 80, 160]
  seed: 42

output:
  results_dir: results
  reports_dir: reports
  auto_open: ask       # ask | always | never
  pdf_enabled: false   # generate PDF versions
  pdf_format: Letter   # Letter | A4 | Legal | Tabloid
  run_name: null
  save_manifest: true