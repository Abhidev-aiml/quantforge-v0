data:
  path: data/raw/daily/xauusd_1D_comma.csv
  symbol: XAUUSD

strategy:
  path: strategies/25_bollinger_rsi_double.py
  params:
    rsi_length: 6
    rsi_oversold: 50
    rsi_overbought: 50
    bb_length: 200
    bb_mult: 2.0

engine:
  initial_cash: 100000.0
  commission_bps: 1.0
  slippage_bps: 5.0
  no_trade_band: 0.01
  warmup_bars: 0

monte_carlo:
  enabled: true
  n_sims: 5000
  n_perm: 500
  block_sizes: [2, 5, 20, 40, 80, 160]
  seed: 42

output:
  results_dir: results
  save_manifest: true