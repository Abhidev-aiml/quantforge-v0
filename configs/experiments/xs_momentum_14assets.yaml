# Cross-sectional momentum across 14 daily assets.
data:
  # We'll pass symbols via a custom loader — this is a placeholder.
  path: data/raw/daily/xauusd_1D_comma.csv
  symbol: PORTFOLIO

engine:
  initial_cash: 100000.0
  commission_bps: 1.0
  slippage_bps: 5.0
  no_trade_band: 0.01
  warmup_bars: 273   # 252 lookback + 21 skip

strategy:
  path: strategies/xs_momentum.py
  params:
    lookback: 252
    skip: 21
    top_k: 3
    bottom_k: 3
    rebalance_freq: "MS"
    long_short: true
    gross_exposure: 1.0

monte_carlo:
  enabled: false   # skip for first run — the multi-asset MC integration comes next session

output:
  results_dir: results
  save_manifest: true