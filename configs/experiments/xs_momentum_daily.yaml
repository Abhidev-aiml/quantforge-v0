# Cross-sectional momentum across all daily CSVs in data/raw/daily/
data:
  directory: data/raw/daily
  pattern: "*_comma.csv"
  exclude:
    - xauusd_1D_comma.csv   # optional: uncomment to exclude gold
  start: null
  end: null

engine:
  initial_cash: 100000.0
  commission_bps: 1.0
  slippage_bps: 5.0
  no_trade_band: 0.01
  warmup_bars: 273

strategy:
  lookback: 252
  skip: 21
  top_k: 3
  bottom_k: 3
  rebalance_freq: "MS"
  long_short: true
  gross_exposure: 1.0

monte_carlo:
  enabled: true
  n_sims: 5000
  seed: 42

output:
  results_dir: results
  save_manifest: true