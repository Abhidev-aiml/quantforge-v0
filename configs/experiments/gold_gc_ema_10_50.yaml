data:
  path: data/raw/daily/xauusd_1D_comma.csv
  symbol: XAUUSD

strategy:
  path: strategies/01e_goldencross_ema_10_50.py
engine:
  initial_cash: 100000.0
  commission_bps: 1.0
  slippage_bps: 5.0
  no_trade_band: 0.01

monte_carlo:
