data:
  path: data/raw/daily/xauusd_1D_comma.csv
  symbol: XAUUSD

strategy:
  path: strategies/24_vwap_reversion.py
  params:
    threshold: 0.015

engine:
  initial_cash: 100000.0
  commission_bps: 1.0
  slippage_bps: 5.0
  no_trade_band: 0.01
  warmup_bars: 0

monte_carlo:
  enabled: true
  n_sims: 5000
  seed: 42

output:
  results_dir: results
  save_manifest: true